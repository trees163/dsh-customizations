# npm distribution patch layer: registers the Comfort client plugin into the
# profile's browser roster. Installing the npm package with
#   dsh plugin --profile web add dsh-client-ui-comfort
# pulls this patch into the profile's layer stack. If you already inserted
# `ui-comfort` manually in your profile's cordis.patch.yml, keep only one of
# the two (the insert id must stay unique).
- insert:
    - id: ui-comfort
      name: 'dsh-client-ui-comfort'
